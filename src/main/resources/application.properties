# Conexión a PostgreSQL. Las credenciales se leen de variables de entorno (no se suben al repositorio).
# En IntelliJ: Run > Edit Configurations > Environment variables: DB_USERNAME=...;DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ReparacionAutomotriz}
spring.datasource.username=${DB_USERNAME:user_java}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# i18n: archivos messages.properties (español) y messages_en.properties (inglés)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
